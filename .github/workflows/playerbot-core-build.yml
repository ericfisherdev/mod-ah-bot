name: playerbot-core-build

# Builds the module inside the core the ericfisherdev server runs:
# mod-playerbots/azerothcore-wotlk, branch Playerbot. core-build.yml builds
# against upstream azerothcore-wotlk master instead, which can hide breakage
# that only shows up on the Playerbot core.
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runner and compiler as the Playerbot core's own module build
          # (core_modules_build.yml).
          - os: ubuntu-24.04
            compiler:
              CC: clang-18
              CXX: clang++-18
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}-playerbot-core
    steps:
      - name: Checkout Playerbot core
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: 'Playerbot'
          submodules: 'recursive'
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'modules/${{ github.event.repository.name }}'
      # linux-build always configures with -DBUILD_TESTING=ON and has no
      # input to turn it off. The core's unit tests cover the core, not
      # this module, and on the Playerbot branch they do not compile
      # (WorldMock lacks IWorld::AddQueryHolderCallback since f15ad9494).
      # Switch them off; fail if the flag is no longer where we expect it.
      - name: Disable core unit tests
        shell: bash
        run: |
          action=.github/actions/linux-build/action.yml
          grep -q -- '-DBUILD_TESTING="ON"' "$action"
          sed -i 's/-DBUILD_TESTING="ON"/-DBUILD_TESTING="OFF"/' "$action"
          grep -q -- '-DBUILD_TESTING="OFF"' "$action"
      # The Playerbot core loads the DB override tables charsections_dbc and
      # emotetextsound_dbc, but no SQL on that branch creates them, so the
      # worldserver dry run aborts on a fresh database. Queue them as a
      # pending update; linux-build's "Process pending sql" step imports it.
      # Definitions follow upstream azerothcore-wotlk 2026_09_21_05.sql.
      - name: Add missing DBC override tables
        shell: bash
        run: |
          pending=data/sql/updates/pending_db_world
          mkdir -p "$pending"
          cat > "$pending/ci_missing_dbc_override_tables.sql" <<'SQL'
          CREATE TABLE IF NOT EXISTS `charsections_dbc` (
            `ID` int NOT NULL DEFAULT '0',
            `RaceID` int NOT NULL DEFAULT '0',
            `SexID` int NOT NULL DEFAULT '0',
            `BaseSection` int NOT NULL DEFAULT '0',
            `TextureName_1` varchar(100) DEFAULT NULL,
            `TextureName_2` varchar(100) DEFAULT NULL,
            `TextureName_3` varchar(100) DEFAULT NULL,
            `Flags` int NOT NULL DEFAULT '0',
            `VariationIndex` int NOT NULL DEFAULT '0',
            `ColorIndex` int NOT NULL DEFAULT '0',
            PRIMARY KEY (`ID`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
            COLLATE=utf8mb4_unicode_ci;

          CREATE TABLE IF NOT EXISTS `emotetextsound_dbc` (
            `ID` int NOT NULL DEFAULT '0',
            `EmotesTextID` int NOT NULL DEFAULT '0',
            `RaceID` int NOT NULL DEFAULT '0',
            `SexID` int NOT NULL DEFAULT '0',
            `SoundID` int NOT NULL DEFAULT '0',
            PRIMARY KEY (`ID`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
            COLLATE=utf8mb4_unicode_ci;
          SQL
      # The core's composite action: configure with -Werror, build, install,
      # then dry-run authserver and worldserver with the module loaded.
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          modules: true
          pch: false
          maxerrors: 0
          keepgoing: true
